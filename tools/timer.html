<!doctype html>
<!--
  Tribe pacing timer. Open in a browser, shrink the window, pin it in a screen corner.
  Big clock counts down to your NEXT section. Below it is the full schedule so you can
  see where you are relative to every block; hover a row to see what you should have
  done by the end of it. Assumes your computer clock is on Eastern Time.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Tribe ⏱</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; min-height: 100%;
    background: #0b0d10; color: #e6e9ee;
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
    -webkit-user-select: none; user-select: none;
  }
  body { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 14px 12px 18px; }
  #clock { font-size: 56px; font-weight: 700; line-height: 1; letter-spacing: 1px; }
  #label { font-size: 12px; opacity: .6; text-transform: uppercase; letter-spacing: 1.5px; text-align: center; }
  #sub   { font-size: 12px; opacity: .8; margin-top: 6px; text-align: center; }
  .ok { color: #4ade80; } .warn { color: #fbbf24; } .crit { color: #f87171; }

  #schedule { width: 100%; max-width: 340px; margin-top: 14px; display: flex; flex-direction: column; gap: 2px; }
  .row {
    display: grid; grid-template-columns: 46px 1fr auto; align-items: baseline; gap: 8px;
    padding: 5px 8px; border-left: 3px solid transparent; border-radius: 4px;
    font-size: 12px; cursor: default; transition: background .15s;
  }
  .row:hover { background: #161a20; }
  .row .t { opacity: .55; font-variant-numeric: tabular-nums; }
  .row.past { opacity: .38; }
  .row.past .t::after { content: " ✓"; }
  .row.cur {
    background: #11161d; border-left-color: #8ab4ff; opacity: 1;
  }
  .row.cur .l { color: #8ab4ff; font-weight: 600; }
  .row .left { font-size: 11px; color: #fbbf24; font-variant-numeric: tabular-nums; }
  #goal {
    width: 100%; max-width: 340px; margin-top: 10px; min-height: 32px;
    font-size: 11.5px; line-height: 1.45; opacity: .85; text-align: left;
    border-top: 1px solid #1c2129; padding-top: 8px;
  }
  #goal b { color: #8ab4ff; font-weight: 600; }
</style>
</head>
<body>
  <div id="clock">--:--:--</div>
  <div id="label">until next section</div>
  <div id="sub"></div>
  <div id="schedule"></div>
  <div id="goal"></div>

<script>
  // All times are TODAY, local clock (assumed ET).
  const mk = (h, m) => { const d = new Date(); d.setHours(h, m, 0, 0); return d; };
  const FREEZE   = mk(15, 30);  // features frozen / start recording prep
  const SUBMIT   = mk(16, 15);  // start submitting (real wall)
  const DEADLINE = mk(16, 30);  // hard deadline

  // [startHour, startMin, label, goal-by-end-of-block]
  const blocks = [
    [11,30,"Sync + lock contract",       "prospect_record shape agreed · demo ask chosen · sample_prospects.json pushed"],
    [11,45,"Frontend skeleton vs mock",  "ask box + live activity stream + cited prospect cards rendering the mock"],
    [12,45,"NL parse + query stub",      "LLM parse: sentence → {cause, geo, min_amount}; query() stub returns the mock"],
    [13,30,"Scoring + make stream real", "0–100 affinity score with 2–3 cited reasons each; stream narrates the real steps"],
    [14,15,"Integration (real query/enrich)", "swap stub for friend's ClickHouse query() + Nimble enrich(); run the demo ask end-to-end on REAL data"],
    [15,0, "Polish + optional Pages dump","tighten UI + narration; if ahead, dump cited results to GitHub Pages"],
    [15,30,"FREEZE + pre-test 5× + cache","run the demo ask 5×; save a known-good cached fallback; clean README. Features frozen."],
    [15,45,"RECORD the 3-min demo",      "problem → type ask → autonomous run (narrate Nimble) → cited results → recap. Upload video, grab the LINK."],
    [16,15,"SUBMIT on Devpost",          "final rebase + push · repo public · Devpost: repo link + VIDEO LINK + all fields"],
    [16,30,"DEADLINE",                   "hard stop — no submissions after this"],
  ].map(([h,m,l,g]) => ({ at: mk(h,m), label: l, goal: g }));

  const pad = n => String(n).padStart(2, "0");
  const hhmm = d => pad(d.getHours()) + ":" + pad(d.getMinutes());
  function fmt(ms) {
    if (ms < 0) ms = 0;
    const s = Math.floor(ms/1000);
    return pad(Math.floor(s/3600)) + ":" + pad(Math.floor(s%3600/60)) + ":" + pad(s%60);
  }
  function mins(ms) { return Math.max(0, Math.round(ms/60000)); }

  // Dynamic favicon: draws the time remaining as the tab icon.
  const COLORS = { ok: "#4ade80", warn: "#fbbf24", crit: "#f87171" };
  const fcanvas = Object.assign(document.createElement("canvas"), { width: 64, height: 64 });
  const fctx = fcanvas.getContext("2d");
  let favicon = document.querySelector("link[rel~='icon']");
  if (!favicon) { favicon = document.createElement("link"); favicon.rel = "icon"; document.head.appendChild(favicon); }
  function drawFavicon(ms, cls) {
    if (ms < 0) ms = 0;
    const m = Math.floor(ms / 60000);
    const text = m >= 60 ? Math.floor(m/60) + "h" : m >= 1 ? String(m) : String(Math.floor(ms/1000));
    fctx.clearRect(0, 0, 64, 64);
    fctx.fillStyle = "#0b0d10"; fctx.fillRect(0, 0, 64, 64);
    fctx.fillStyle = COLORS[cls] || "#e6e9ee";
    fctx.font = "bold " + (text.length >= 3 ? 34 : 48) + "px ui-monospace, Consolas, monospace";
    fctx.textAlign = "center"; fctx.textBaseline = "middle";
    fctx.fillText(text, 32, 37);
    favicon.href = fcanvas.toDataURL("image/png");
  }

  // Build the schedule rows once; we just toggle classes/text each tick.
  const sched = document.getElementById("schedule");
  const goalEl = document.getElementById("goal");
  let hovered = null; // index the user is hovering, or null
  const rowEls = blocks.map((b, i) => {
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML =
      '<span class="t">' + hhmm(b.at) + '</span>' +
      '<span class="l">' + b.label + '</span>' +
      '<span class="left"></span>';
    row.addEventListener("mouseenter", () => { hovered = i; renderGoal(); });
    row.addEventListener("mouseleave", () => { hovered = null; renderGoal(); });
    sched.appendChild(row);
    return row;
  });

  let curIdx = -1;
  function renderGoal() {
    const i = hovered != null ? hovered : curIdx;
    if (i < 0) { goalEl.innerHTML = "<b>not started</b> — first block is 11:30"; return; }
    const verb = (hovered != null && hovered < curIdx) ? "should be done"
               : (hovered != null && hovered > curIdx) ? "coming up"
               : "do now";
    goalEl.innerHTML = "<b>" + hhmm(blocks[i].at) + " · " + verb + ":</b> " + blocks[i].goal;
  }

  function tick() {
    const now = new Date();

    // current block + next block
    curIdx = -1;
    for (let i = 0; i < blocks.length; i++) if (now >= blocks[i].at) curIdx = i;
    const cur  = curIdx >= 0 ? blocks[curIdx] : null;
    const next = blocks[curIdx + 1] || (blocks.find(b => b.at > now) || null);

    // Big clock = countdown to the NEXT section (falls back to the deadline).
    const target = next ? next.at : DEADLINE;
    const left = target - now;
    const clk = document.getElementById("clock");
    clk.textContent = fmt(left);
    const m = left / 60000;
    const cls = m > 15 ? "ok" : m > 5 ? "warn" : "crit";
    clk.className = cls;

    document.getElementById("label").textContent =
      next ? ("until " + hhmm(next.at) + " · " + next.label) : "until 4:30 deadline";

    // Schedule rows: dim past, highlight current, show time-left on current.
    rowEls.forEach((row, i) => {
      row.classList.toggle("past", i < curIdx);
      row.classList.toggle("cur",  i === curIdx);
      const leftEl = row.querySelector(".left");
      if (i === curIdx && next) {
        const ml = mins(next.at - now);
        leftEl.textContent = ml >= 1 ? ml + "m left" : "<1m";
      } else {
        leftEl.textContent = "";
      }
    });
    renderGoal();

    // Secondary line keeps the freeze/submit deadline visible.
    const sub = document.getElementById("sub");
    if (now < FREEZE)      sub.textContent = "freeze in " + fmt(FREEZE - now) + "  ·  submit by " + fmt(SUBMIT - now);
    else if (now < SUBMIT) sub.textContent = "🔴 FREEZE — record now. submit in " + fmt(SUBMIT - now);
    else                   sub.textContent = "🔴 SUBMIT NOW";

    document.title = fmt(left).replace(/^00:/, "");
    drawFavicon(left, cls);
  }
  tick(); setInterval(tick, 1000);
</script>
</body>
</html>
